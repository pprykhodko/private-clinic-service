{% extends "layouts/base.html" %}

{% block content %}
  <div class="card border-0 shadow-sm">
    <div class="card-header">Delete Appointment</div>
    
    <div class="card-body">
      <p>Are you sure you want to delete appointment #{{ appointment.id }}?</p>
      <form method="post">
        {% csrf_token %}
        <input type="submit" value="Delete" class="btn btn-danger">
        <a href="{% url 'clinic:appointment-detail' pk=appointment.pk %}" class="btn btn-outline-secondary">Cancel</a>
      </form>
    </div>
  </div>
{% endblock %}
