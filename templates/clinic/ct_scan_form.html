{% extends "layouts/base.html" %}
{% load crispy_forms_filters %}

{% block content %}
  <div class="mb-4">
    <h1 class="h3 mb-0">Create CT scan</h1>
    <p class="text-muted mb-0">Upload a patient tomography image</p>
  </div>
  <div class="card border-0 shadow-sm">
    <div class="card-body">
      <form method="post" enctype="multipart/form-data" novalidate>
        {% csrf_token %}
        {{ form|crispy }}
        <div class="mt-4">
          <input type="submit" value="Submit" class="btn btn-primary">
          <a href="{% url 'clinic:ct-scan-list' %}" class="btn btn-outline-secondary">
            Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
