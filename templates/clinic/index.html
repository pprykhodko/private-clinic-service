{% extends "layouts/base.html" %}

{% block content %}
  <div class="py-4">
    <div class="mb-4">
      <h1 class="h3">
        Welcome back, {{ user.first_name }} {{ user.last_name }}
      </h1>
      <p class="text-muted">
        Manage patients, appointments and CT scans
      </p>
    </div>

    <div class="row">
      <div class="col-md-3 mb-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">
              Doctors
            </h6>
            <h2>{{ num_doctors }}</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">
              Patients
            </h6>
            <h2>{{ num_patients }}</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">
              Appointments
            </h6>
            <h2>{{ num_appointments }}</h2>
          </div>
        </div>
      </div>

      <div class="col-md-3 mb-4">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h6 class="text-muted">
              CT Scans
            </h6>
            <h2>{{ num_images }}</h2>
          </div>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
